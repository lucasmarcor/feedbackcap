<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans text-gray-800 min-h-screen">
    
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Panel de Carga Súper Simplificado -->
        <div class="bg-white p-6 rounded-xl shadow-lg lg:col-span-1 h-fit sticky top-6 border-t-4 border-blue-600">
            <h2 class="text-xl font-bold mb-6 text-blue-800 border-b pb-2">Registrar Contacto</h2>
            
            <form id="feedbackForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Servicio Consultado</label>
                    <select id="service" class="w-full border-gray-300 rounded-md shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500 bg-gray-50" required>
                        <option value="" disabled selected>Seleccionar...</option>
                        <option value="Ecografía">Ecografía</option>
                        <option value="Doppler">Doppler</option>
                        <option value="Resonancias">Resonancias</option>
                        <option value="Tomografías">Tomografías</option>
                        <option value="Densitometría">Densitometría</option>
                        <option value="Mamografía">Mamografía</option>
                        <option value="Radiología">Radiología</option>
                        <option value="Radiología odontológica">Radiología odontológica</option>
                        <option value="Cone Beam">Cone Beam</option>
                        <option value="Cardiología">Cardiología</option>
                        <option value="Pet">Pet</option>
                        <option value="Medicina Nuclear">Medicina Nuclear</option>
                        <option value="Chequeo médicos">Chequeo médicos</option>
                        <option value="Anatomía Patológica">Anatomía Patológica</option>
                        <option value="Test de Aire Espirado SIBO/H Pylori">Test de Aire Espirado SIBO/H Pylori</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Motivo de no confirmación</label>
                    <select id="reason" class="w-full border-gray-300 rounded-md shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500 bg-gray-50" required>
                        <option value="" disabled selected>Seleccionar...</option>
                        <option value="Aún no lo decidió">Aún no lo decidió</option>
                        <option value="Precio elevado">Precio elevado</option>
                        <option value="Disponibilidad de turnos">Disponibilidad de turnos</option>
                        <option value="Por el momento no va a hacerlo">Por el momento no va a hacerlo</option>
                        <option value="Lo hará en otro centro">Lo hará en otro centro</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Comentarios Adicionales</label>
                    <textarea id="comments" rows="3" placeholder="Detalles extra del llamado..." class="w-full border-gray-300 rounded-md shadow-sm p-2.5 border focus:ring-blue-500 focus:border-blue-500 bg-gray-50"></textarea>
                </div>

                <button id="submitBtn" type="submit" class="w-full bg-blue-600 text-white font-bold py-3 px-4 rounded-md hover:bg-blue-700 transition duration-200 shadow-md">
                    Guardar Registro
                </button>
            </form>
        </div>

        <!-- Dashboard Simplificado (Solo Listas) -->
        <div class="bg-white p-6 rounded-xl shadow-lg lg:col-span-2 relative">
            <button id="exportBtn" class="absolute top-6 right-6 bg-slate-800 text-white text-sm font-bold py-2 px-4 rounded-md hover:bg-slate-900 transition duration-200 shadow-md flex items-center gap-2 z-10">
                Exportar PDF
            </button>
            
            <div id="pdf-content" class="mt-14 lg:mt-0 p-2">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-4">
                    Reporte de Gestión
                </h2>
                
                <div class="mb-6 p-5 bg-blue-50 rounded-lg flex items-center justify-between border border-blue-200 shadow-sm">
                    <span class="text-lg font-semibold text-blue-900">Total general de contactados:</span>
                    <span id="totalContacts" class="text-4xl font-bold text-blue-600">0</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <!-- Lista de Servicios -->
                    <div class="bg-gray-50 p-5 rounded-lg border border-gray-200 shadow-sm">
                        <h3 class="font-bold text-gray-800 mb-4 text-lg border-b pb-2">Servicios Consultados</h3>
                        <ul id="serviceList" class="space-y-2">
                            <!-- Los items se inyectan aquí -->
                        </ul>
                    </div>

                    <!-- Lista de Motivos -->
                    <div class="bg-gray-50 p-5 rounded-lg border border-gray-200 shadow-sm">
                        <h3 class="font-bold text-gray-800 mb-4 text-lg border-b pb-2">Motivos de No Confirmación</h3>
                        <ul id="reasonList" class="space-y-2">
                            <!-- Los items se inyectan aquí -->
                        </ul>
                    </div>
                </div>

                <!-- Comentarios -->
                <div>
                    <h3 class="text-xl font-bold text-gray-800 mb-4 border-b pb-2">Comentarios Adicionales</h3>
                    <div id="commentsList" class="space-y-4 bg-gray-50 p-5 rounded-lg border border-gray-200 shadow-inner min-h-[100px]">
                        <!-- Los comentarios se inyectan aquí -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Integración Modular de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // Se quitó orderBy de la importación ya que el ordenamiento se hará localmente
        import { getFirestore, collection, addDoc, query, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAI_LhLiGAMgWfOw9Gs8jXJXtrLTfbMesM",
            authDomain: "feedbackcap-dc24d.firebaseapp.com",
            projectId: "feedbackcap-dc24d",
            storageBucket: "feedbackcap-dc24d.firebasestorage.app",
            messagingSenderId: "572312831664",
            appId: "1:572312831664:web:a6458e4a8a047f52951d75"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Referencias al DOM
        const serviceListEl = document.getElementById('serviceList');
        const reasonListEl = document.getElementById('reasonList');
        const commentsListEl = document.getElementById('commentsList');
        const totalContactsEl = document.getElementById('totalContacts');
        const submitBtn = document.getElementById('submitBtn');
        const feedbackForm = document.getElementById('feedbackForm');

        // Escuchar datos en tiempo real de toda la colección (SIN filtros que excluyan registros viejos)
        const q = query(collection(db, "feedbacks"));
        
        onSnapshot(q, (querySnapshot) => {
            const data = [];
            querySnapshot.forEach((doc) => data.push(doc.data()));
            
            // Ordenar localmente para asegurar que los comentarios nuevos queden arriba 
            // Esto evita el bug de Firestore al mezclar registros con y sin fecha
            data.sort((a, b) => {
                const timeA = typeof a.timestamp === 'number' ? a.timestamp : (a.timestamp?.toMillis ? a.timestamp.toMillis() : 0);
                const timeB = typeof b.timestamp === 'number' ? b.timestamp : (b.timestamp?.toMillis ? b.timestamp.toMillis() : 0);
                return timeB - timeA;
            });

            updateDashboard(data);
        }, (error) => {
            console.error("Error al leer datos:", error);
            serviceListEl.innerHTML = `<li class="text-red-500 font-bold p-2 text-center">Revisa tu conexión a internet o los permisos de lectura de Firebase.</li>`;
        });

        function updateDashboard(data) {
            totalContactsEl.textContent = data.length;
            
            const serviceCounts = {};
            const reasonCounts = {};
            const comments = [];

            // Procesar conteos
            data.forEach(item => {
                serviceCounts[item.service] = (serviceCounts[item.service] || 0) + 1;
                reasonCounts[item.reason] = (reasonCounts[item.reason] || 0) + 1;
                
                if (item.comment && item.comment.trim() !== '') {
                    comments.push({ s: item.service, r: item.reason, c: item.comment });
                }
            });

            renderList(serviceListEl, serviceCounts);
            renderList(reasonListEl, reasonCounts);
            renderComments(comments);
        }

        function renderList(listElement, countsObj) {
            listElement.innerHTML = '';
            // Ordenar de mayor a menor
            const sortedCounts = Object.entries(countsObj).sort((a, b) => b[1] - a[1]);
            
            if (sortedCounts.length === 0) {
                listElement.innerHTML = '<li class="text-sm text-gray-500 italic py-2 text-center">Aún no hay datos cargados</li>';
                return;
            }

            sortedCounts.forEach(([name, count]) => {
                listElement.innerHTML += `
                    <li class="flex justify-between items-center bg-white p-3 rounded shadow-sm border border-gray-100">
                        <span class="font-medium text-gray-700">${name}</span> 
                        <span class="bg-blue-600 text-white font-bold px-3 py-1 rounded-full text-sm">${count}</span>
                    </li>`;
            });
        }

        function renderComments(comments) {
            commentsListEl.innerHTML = comments.length === 0 
                ? '<p class="text-sm text-gray-500 italic text-center py-4">No hay comentarios registrados.</p>' 
                : '';
            
            comments.forEach(item => {
                commentsListEl.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                        <p class="text-gray-800 mb-3 text-sm md:text-base">"${item.c}"</p>
                        <div class="flex gap-2 flex-wrap mt-2 pt-2 border-t border-gray-100">
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded font-medium">S: ${item.s}</span>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded font-medium">M: ${item.r}</span>
                        </div>
                    </div>`;
            });
        }

        // Guardar nuevo registro optimizado para velocidad
        feedbackForm.addEventListener('submit', (e) => {
            e.preventDefault();
            
            submitBtn.innerText = "Guardando...";
            submitBtn.disabled = true;

            const service = document.getElementById('service').value;
            const reason = document.getElementById('reason').value;
            const comment = document.getElementById('comments').value;

            // Enviar a la nube en segundo plano (sin 'await' para evitar bloqueos)
            addDoc(collection(db, "feedbacks"), { 
                service: service, 
                reason: reason, 
                comment: comment, 
                timestamp: Date.now() 
            }).catch((error) => {
                console.error("Firebase sincronizará cuando recupere conexión: ", error);
            });
            
            // Liberar la interfaz casi de inmediato para el siguiente llamado
            setTimeout(() => {
                feedbackForm.reset(); // Vuelve todos los campos a su estado original
                submitBtn.innerText = "Guardar Registro";
                submitBtn.disabled = false;
            }, 300); // 300ms permite un feedback visual cómodo
        });

        // Exportar PDF
        document.getElementById('exportBtn').addEventListener('click', () => {
            const element = document.getElementById('pdf-content');
            
            const opt = {
                margin: 10,
                filename: `Reporte_Feedback_General.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        });
    </script>
</body>
</html>
