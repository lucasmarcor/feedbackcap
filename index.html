<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Feedback</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .chart-container { position: relative; height: 250px; width: 100%; }
    </style>
</head>
<body class="bg-gray-100 p-4 md:p-8 font-sans text-gray-800 min-h-screen">
    
    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Panel de Carga -->
        <div class="bg-white p-6 rounded-xl shadow-lg lg:col-span-1 h-fit sticky top-6">
            <h2 class="text-xl font-bold mb-4 text-blue-700 border-b pb-2">Registrar Contacto</h2>
            
            <form id="feedbackForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de gestión</label>
                    <input type="date" id="datePicker" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500" required>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Servicio Consultado</label>
                    <select id="service" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500" required>
                        <option value="" disabled selected>Seleccionar...</option>
                        <option value="Ecografía">Ecografía</option>
                        <option value="Doppler">Doppler</option>
                        <option value="Resonancias">Resonancias</option>
                        <option value="Tomografías">Tomografías</option>
                        <option value="Densitometría">Densitometría</option>
                        <option value="Mamografía">Mamografía</option>
                        <option value="Radiología">Radiología</option>
                        <option value="Radiología odontológica">Radiología odontológica</option>
                        <option value="Cone Beam">Cone Beam</option>
                        <option value="Cardiología">Cardiología</option>
                        <option value="Pet">Pet</option>
                        <option value="Medicina Nuclear">Medicina Nuclear</option>
                        <option value="Chequeo médicos">Chequeo médicos</option>
                        <option value="Anatomía Patológica">Anatomía Patológica</option>
                        <option value="Test de Aire Espirado SIBO/H Pylori">Test de Aire Espirado SIBO/H Pylori</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Motivo de no confirmación</label>
                    <select id="reason" class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500" required>
                        <option value="" disabled selected>Seleccionar...</option>
                        <option value="Aún no lo decidió">Aún no lo decidió</option>
                        <option value="Precio elevado">Precio elevado</option>
                        <option value="Disponibilidad de turnos">Disponibilidad de turnos</option>
                        <option value="Por el momento no va a hacerlo">Por el momento no va a hacerlo</option>
                        <option value="Lo hará en otro centro">Lo hará en otro centro</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Comentarios Adicionales</label>
                    <textarea id="comments" rows="3" placeholder="Detalles extra del llamado..." class="w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 px-4 rounded-md hover:bg-blue-700 transition duration-200 shadow">
                    Guardar Registro
                </button>
            </form>
        </div>

        <!-- Dashboard -->
        <div class="bg-white p-6 rounded-xl shadow-lg lg:col-span-2 relative">
            <button id="exportBtn" class="absolute top-6 right-6 bg-slate-800 text-white text-sm font-bold py-2 px-4 rounded-md hover:bg-slate-900 transition duration-200 shadow-md flex items-center gap-2 z-10">
                Exportar PDF
            </button>
            
            <div id="pdf-content" class="mt-12 lg:mt-0 p-2">
                <h2 class="text-2xl font-bold mb-4 text-gray-800 border-b pb-2">Reporte de Gestión: <span id="displayDate" class="text-blue-600"></span></h2>
                
                <div class="mb-6 p-4 bg-blue-50 rounded-lg flex items-center justify-between border border-blue-100">
                    <span class="text-lg font-semibold text-blue-900">Total contactados:</span>
                    <span id="totalContacts" class="text-3xl font-bold text-blue-600">0</span>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                    <!-- Servicios -->
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 flex flex-col h-full">
                        <h3 class="text-center font-bold text-gray-700 mb-4">Servicios Consultados</h3>
                        <div class="chart-container mb-4 flex-grow"><canvas id="serviceChart"></canvas></div>
                        <div class="bg-white p-3 rounded shadow-sm border mt-auto">
                            <h4 class="text-xs font-bold text-gray-500 uppercase mb-2 border-b pb-1">Detalle</h4>
                            <ul id="serviceList" class="space-y-1.5 max-h-48 overflow-y-auto pr-2"></ul>
                        </div>
                    </div>

                    <!-- Motivos -->
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 flex flex-col h-full">
                        <h3 class="text-center font-bold text-gray-700 mb-4">Motivos de No Confirmación</h3>
                        <div class="chart-container mb-4 flex-grow"><canvas id="reasonChart"></canvas></div>
                        <div class="bg-white p-3 rounded shadow-sm border mt-auto">
                            <h4 class="text-xs font-bold text-gray-500 uppercase mb-2 border-b pb-1">Detalle</h4>
                            <ul id="reasonList" class="space-y-1.5 max-h-48 overflow-y-auto pr-2"></ul>
                        </div>
                    </div>
                </div>

                <!-- Comentarios -->
                <div>
                    <h3 class="text-lg font-bold text-gray-800 mb-3 border-b pb-2">Comentarios Adicionales</h3>
                    <div id="commentsList" class="space-y-3 max-h-72 overflow-y-auto bg-gray-50 p-4 rounded-lg border border-gray-200"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Integración Modular de Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // ⚠️ PEGA AQUÍ TU CONFIGURACIÓN DE FIREBASE ⚠️
        const firebaseConfig = {
            apiKey: "AIzaSyAI_LhLiGAMgWfOw9Gs8jXJXtrLTfbMesM",
            authDomain: "feedbackcap-dc24d.firebaseapp.com",
            projectId: "feedbackcap-dc24d",
            storageBucket: "feedbackcap-dc24d.firebasestorage.app",
            messagingSenderId: "572312831664",
            appId: "1:572312831664:web:a6458e4a8a047f52951d75"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let serviceChartInstance = null;
        let reasonChartInstance = null;
        let currentUnsubscribe = null;

        const datePicker = document.getElementById('datePicker');
        const displayDate = document.getElementById('displayDate');
        datePicker.value = new Date().toISOString().split('T')[0];

        const chartColors = ['#3b82f6', '#ef4444', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16'];

        function loadData() {
            const date = datePicker.value;
            const [year, month, day] = date.split('-');
            displayDate.textContent = `${day}/${month}/${year}`;

            if (currentUnsubscribe) currentUnsubscribe();

            const q = query(collection(db, "feedbacks"), where("date", "==", date));
            
            // onSnapshot mantiene los gráficos actualizados en vivo
            currentUnsubscribe = onSnapshot(q, (querySnapshot) => {
                const data = [];
                querySnapshot.forEach((doc) => data.push(doc.data()));
                updateDashboard(data);
            });
        }

        function updateDashboard(data) {
            document.getElementById('totalContacts').textContent = data.length;
            const serviceCounts = {};
            const reasonCounts = {};
            const comments = [];

            data.forEach(item => {
                serviceCounts[item.service] = (serviceCounts[item.service] || 0) + 1;
                reasonCounts[item.reason] = (reasonCounts[item.reason] || 0) + 1;
                if (item.comment && item.comment.trim() !== '') {
                    comments.push({ s: item.service, r: item.reason, c: item.comment });
                }
            });

            renderChartAndList('serviceChart', document.getElementById('serviceList'), serviceCounts);
            renderChartAndList('reasonChart', document.getElementById('reasonList'), reasonCounts);
            renderComments(comments);
        }

        function renderChartAndList(canvasId, listEl, countsObj) {
            const labels = Object.keys(countsObj);
            const dataValues = Object.values(countsObj);
            
            if (canvasId === 'serviceChart' && serviceChartInstance) serviceChartInstance.destroy();
            if (canvasId === 'reasonChart' && reasonChartInstance) reasonChartInstance.destroy();

            listEl.innerHTML = '';
            const sortedCounts = Object.entries(countsObj).sort((a, b) => b[1] - a[1]);
            
            if (sortedCounts.length === 0) {
                listEl.innerHTML = '<li class="text-sm text-gray-500 italic py-2 text-center">Sin datos registrados</li>';
            } else {
                sortedCounts.forEach(([name, count]) => {
                    listEl.innerHTML += `<li class="flex justify-between items-center text-sm text-gray-700 py-1.5 border-b border-gray-100 last:border-0"><span class="font-medium pr-2">${name}</span> <span class="bg-blue-100 text-blue-800 font-bold px-2 py-0.5 rounded-full text-xs">${count}</span></li>`;
                });
            }

            const ctx = document.getElementById(canvasId).getContext('2d');
            const newChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels.length ? labels : ['Sin datos'],
                    datasets: [{
                        data: dataValues.length ? dataValues : [1],
                        backgroundColor: dataValues.length ? chartColors.slice(0, labels.length) : ['#e5e7eb'],
                        borderWidth: 1, borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false },
                        tooltip: { enabled: dataValues.length > 0 }
                    }
                }
            });

            if (canvasId === 'serviceChart') serviceChartInstance = newChart;
            if (canvasId === 'reasonChart') reasonChartInstance = newChart;
        }

        function renderComments(comments) {
            const commentsListEl = document.getElementById('commentsList');
            commentsListEl.innerHTML = comments.length === 0 
                ? '<p class="text-sm text-gray-500 italic">No hay comentarios.</p>' 
                : '';
            
            comments.forEach(item => {
                commentsListEl.innerHTML += `
                    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
                        <p class="text-gray-800 mb-2 italic">"${item.c}"</p>
                        <div class="flex gap-2 flex-wrap">
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded"><strong>Serv:</strong> ${item.s}</span>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded"><strong>Mot:</strong> ${item.r}</span>
                        </div>
                    </div>`;
            });
        }

        datePicker.addEventListener('change', loadData);

        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = datePicker.value;
            const service = document.getElementById('service').value;
            const reason = document.getElementById('reason').value;
            const comment = document.getElementById('comments').value;

            try {
                await addDoc(collection(db, "feedbacks"), { date, service, reason, comment, timestamp: new Date() });
                document.getElementById('service').value = '';
                document.getElementById('reason').value = '';
                document.getElementById('comments').value = '';
            } catch (error) {
                console.error("Error guardando el registro: ", error);
                alert("Hubo un error al guardar. Revisa la conexión a Firebase.");
            }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const element = document.getElementById('pdf-content');
            document.getElementById('serviceList').classList.remove('max-h-48', 'overflow-y-auto');
            document.getElementById('reasonList').classList.remove('max-h-48', 'overflow-y-auto');
            document.getElementById('commentsList').classList.remove('max-h-72', 'overflow-y-auto');

            html2pdf().set({
                margin: 10,
                filename: `Feedback_${displayDate.textContent.replace(/\//g, '-')}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save().then(() => {
                document.getElementById('serviceList').classList.add('max-h-48', 'overflow-y-auto');
                document.getElementById('reasonList').classList.add('max-h-48', 'overflow-y-auto');
                document.getElementById('commentsList').classList.add('max-h-72', 'overflow-y-auto');
            });
        });

        loadData();
    </script>
</body>
</html>
